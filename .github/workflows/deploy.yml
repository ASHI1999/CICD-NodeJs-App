name: "CICD NodeJS Application"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: DockerHub Login
      #   env:
      #     DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      #     DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      #   run: |
      #     printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
      #       --username "$DOCKERHUB_USERNAME" \
      #       --password-stdin
            - name: Check Docker Hub Credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Docker Hub username: $DOCKERHUB_USERNAME"
          echo "Token length: ${#DOCKERHUB_TOKEN}"
          echo "Token prefix:"
          printf '%s' "$DOCKERHUB_TOKEN" | cut -c1-9

      - name: Build Dockerfile
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app .

      - name: Push to DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-app

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/CICD-NodeJS-App
            docker compose down
            docker compose up -d --build


